name: validate-design-os
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - run: npm install --ignore-scripts --package-lock=false
      - run: npm run validate
      - run: npm run eval:skills
  browser-hard-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --package-lock=false
      - run: npx playwright install --with-deps chromium
      - name: Nocturne accessibility and browser gates
        run: npx playwright test tests/release-gates.spec.ts --project=edge-mobile --project=desktop
        env:
          TARGET_URL: http://127.0.0.1:4173
          STATIC_DIR: experiments/nocturne-concierge
          STATIC_PORT: '4173'
      - name: Linehold accessibility and browser gates
        run: npx playwright test tests/release-gates.spec.ts --project=edge-mobile --project=desktop
        env:
          TARGET_URL: http://127.0.0.1:4174
          STATIC_DIR: experiments/linehold-forge
          STATIC_PORT: '4174'
      - name: Launch site accessibility and browser gates
        run: npx playwright test tests/release-gates.spec.ts tests/launch-site.spec.ts --project=edge-mobile --project=tablet --project=desktop
        env:
          TARGET_URL: http://127.0.0.1:4175
          STATIC_DIR: site
          STATIC_PORT: '4175'
