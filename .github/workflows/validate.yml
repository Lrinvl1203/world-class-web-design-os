name: validate-design-os
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 scripts/validate_skills.py
      - run: python3 scripts/validate_wdx_score.py examples/wdx-score.sample.json
