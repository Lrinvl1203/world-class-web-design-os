name: deploy-pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --package-lock=false
      - run: npx playwright install --with-deps chromium
      - name: Verify launch site
        run: npx playwright test tests/release-gates.spec.ts tests/launch-site.spec.ts --project=edge-mobile --project=tablet --project=desktop
        env:
          TARGET_URL: http://127.0.0.1:4175
          STATIC_DIR: site
          STATIC_PORT: '4175'
      - name: Assemble Pages artifact
        shell: bash
        run: |
          mkdir -p _site/experiments
          cp -R site/. _site/
          cp -R experiments/nocturne-concierge _site/experiments/
          cp -R experiments/vanta-forge _site/experiments/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
