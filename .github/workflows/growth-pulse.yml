name: growth-pulse

on:
  workflow_dispatch:
  schedule:
    - cron: '17 0 * * *'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Capture repository signals
        run: node scripts/growth/snapshot.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GROWTH_TRAFFIC_TOKEN || secrets.GITHUB_TOKEN }}
          GROWTH_TRAFFIC_TOKEN_CONFIGURED: ${{ secrets.GROWTH_TRAFFIC_TOKEN != '' }}
      - uses: actions/upload-artifact@v6
        with:
          name: growth-pulse-${{ github.run_id }}
          path: artifacts/growth/latest.json
          retention-days: 90
